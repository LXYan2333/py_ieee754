[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "py_ieee754"
version = "0.1.2"
description = "IEEE 754 float module with bit-operation and round arithmetic support"
readme = "README.md"
requires-python = ">=3.13"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "LXYan2333" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pyright>=1.1"]

[tool.scikit-build]
cmake.version = ">=3.25"
wheel.py-api = "py3"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "A"]
ignore = ["A004"]

[tool.ruff.lint.isort]
known-first-party = ["py_ieee754"]
force-sort-within-sections = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.coverage.run]
omit = ["tests/*"]
